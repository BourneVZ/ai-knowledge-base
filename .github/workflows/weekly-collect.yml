name: Weekly Collect

on:
  schedule:
    # 每周六北京时间 02:00 = 周五 UTC 18:00
    - cron: "0 18 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    # 钉住 24.04，避免 ubuntu-latest 迁移 Ubuntu 26 带来环境漂移
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LangGraph workflow
        id: workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUDGET_YUAN: ${{ vars.BUDGET_YUAN }}
          # Reviser 单次重写全部条目，prompt/response 都很大，
          # 默认读超时不够（实测 4 次全超时），放宽上限
          LLM_TIMEOUT: "600"
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_DEFAULT_MODEL: ${{ vars.DEEPSEEK_DEFAULT_MODEL }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
          QWEN_DEFAULT_MODEL: ${{ vars.QWEN_DEFAULT_MODEL }}
        run: |
          python workflows/graph.py 2>&1 | tee workflow.log
          echo "logfile=workflow.log" >> "$GITHUB_OUTPUT"

      - name: Compute date
        id: date
        # organizer 用 UTC 日期命名文件（datetime.now(timezone.utc)），
        # 此处必须同用 UTC：若按北京时间（+8h）计算会差一天，统计与提交将落空
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Count articles
        id: count
        run: |
          DATE="${{ steps.date.outputs.today }}"
          COUNT=$(ls knowledge/articles/${DATE}-*.json 2>/dev/null | wc -l)
          PENDING=$(ls knowledge/pending_review/pending-${DATE}-*.json 2>/dev/null | wc -l)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "pending=${PENDING}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "Articles collected: ${COUNT} (pending review: ${PENDING}) on ${DATE}"

      # 0 条时跳过校验钩子——hooks 对空通配符会 exit 1，制造假错误告警
      - name: Validate articles
        if: steps.count.outputs.count != '0'
        continue-on-error: true
        run: python hooks/validate_json.py knowledge/articles/${{ steps.date.outputs.today }}-*.json

      - name: Check article quality
        if: steps.count.outputs.count != '0'
        continue-on-error: true
        run: python hooks/check_quality.py knowledge/articles/${{ steps.date.outputs.today }}-*.json

      # 只要 knowledge/ 有变更就提交（含 raw 原始记录与 pending_review 待审数据），
      # 避免审核未过、当日 0 篇时把 raw 数据丢在临时 runner 上
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge/
          if git diff --cached --quiet; then
            echo "No knowledge changes to commit"
            exit 0
          fi
          if [ "${{ steps.count.outputs.count }}" != "0" ]; then
            MSG="chore: collect ${{ steps.count.outputs.count }} articles (${{ steps.count.outputs.date }})"
          else
            MSG="chore: collect 0 articles, ${{ steps.count.outputs.pending }} pending review (${{ steps.count.outputs.date }})"
          fi
          git commit -m "$MSG"
          git push
